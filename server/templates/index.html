<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Plotter</title>
<style>
  :root {
    --bg: #f5f6f9;
    --card: #ffffff;
    --ink: #232734;
    --ink-soft: #888fa1;
    --dash: #d7dae3;
    --accent: #6d5cf0;
    --accent-dark: #5a49e0;
    --badge: #ece9fd;
    --ok: #2f9e6b;
    --err: #d8503f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161c; --card: #1e2029; --ink: #eceef5; --ink-soft: #9499ab;
      --dash: #383b48; --accent: #8b7cf6; --accent-dark: #7a6bf0; --badge: #2a2740;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 600px; }

  /* Header */
  .head { text-align: center; margin-bottom: 30px; }
  .badge {
    width: 60px; height: 60px; border-radius: 16px;
    background: var(--badge); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .badge svg { width: 28px; height: 28px; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--ink-soft); margin: 8px 0 0; font-size: 15px; }

  /* Entry cards */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 440px) { .cards { grid-template-columns: 1fr; } }
  .card {
    -webkit-appearance: none; appearance: none; font: inherit; color: inherit;
    background: var(--card); border: 2px dashed var(--dash); border-radius: 18px;
    padding: 30px 18px; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: border-color .15s ease, background-color .15s ease, transform .05s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: translateY(1px); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .card .badge { margin-bottom: 12px; }
  .card .title { font-weight: 650; font-size: 16px; }
  .card .note { color: var(--ink-soft); font-size: 13px; }

  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* Preview state */
  .review { display: none; }
  .review.show { display: block; }
  .cards.hide { display: none; }
  .stage {
    background: var(--card); border: 1px solid var(--dash); border-radius: 18px;
    aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden;
  }
  .stage img { width: 100%; height: 100%; object-fit: contain; }
  .meta { color: var(--ink-soft); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; margin: 12px 2px 0; word-break: break-all; }

  .btn {
    -webkit-appearance: none; appearance: none; cursor: pointer; font: 650 16px/1 inherit;
    width: 100%; padding: 16px; border-radius: 14px; border: 1px solid transparent;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: background-color .15s ease, transform .05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: #fff; margin-top: 16px; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .link {
    background: none; border: 0; color: var(--accent); cursor: pointer;
    font: 600 14px/1 inherit; padding: 14px; width: 100%; margin-top: 4px;
  }
  .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .bar { height: 6px; background: var(--dash); border-radius: 99px; overflow: hidden; margin-top: 16px; display: none; }
  .bar > span { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .12s linear; }
  .status { margin-top: 14px; font-size: 14px; min-height: 20px; text-align: center; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <span class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V2h12v7"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8" rx="1"/>
      </svg>
    </span>
    <h1>Photo Plotter</h1>
    <p class="sub">Capture or select a photo, then send it to the plotter.</p>
  </div>

  <!-- Entry: two ways to pick a photo -->
  <div class="cards" id="cards">
    <button class="card" id="takeBtn" type="button">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      </span>
      <span class="title">Take Photo</span>
      <span class="note">Use your camera</span>
    </button>

    <button class="card" id="chooseBtn" type="button">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </span>
      <span class="title">Choose File</span>
      <span class="note">From your device</span>
    </button>
  </div>

  <!-- capture="environment" opens the rear camera; the plain input lets them pick from gallery/files -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment">
  <input type="file" id="fileInput" accept="image/*">

  <!-- Review + send -->
  <div class="review" id="review">
    <div class="stage"><img id="preview" alt="Selected photo preview"></div>
    <p class="meta" id="meta"></p>
    <div class="bar" id="bar"><span id="barFill"></span></div>
    <button class="btn btn-primary" id="sendBtn" type="button">Send to plotter</button>
    <button class="link" id="resetBtn" type="button">Choose a different photo</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

</div>

<script>
  const cards       = document.getElementById('cards');
  const review      = document.getElementById('review');
  const takeBtn     = document.getElementById('takeBtn');
  const chooseBtn   = document.getElementById('chooseBtn');
  const cameraInput = document.getElementById('cameraInput');
  const fileInput   = document.getElementById('fileInput');
  const preview     = document.getElementById('preview');
  const meta        = document.getElementById('meta');
  const sendBtn     = document.getElementById('sendBtn');
  const resetBtn    = document.getElementById('resetBtn');
  const bar         = document.getElementById('bar');
  const barFill     = document.getElementById('barFill');
  const statusEl    = document.getElementById('status');

  let chosen = null;

  takeBtn.addEventListener('click', () => cameraInput.click());
  chooseBtn.addEventListener('click', () => fileInput.click());
  cameraInput.addEventListener('change', () => onPicked(cameraInput.files[0]));
  fileInput.addEventListener('change', () => onPicked(fileInput.files[0]));
  resetBtn.addEventListener('click', reset);

  function onPicked(file) {
    if (!file) return;
    chosen = file;
    preview.src = URL.createObjectURL(file);
    cards.classList.add('hide');
    review.classList.add('show');
    sendBtn.disabled = false;
    setStatus('', '');
    meta.textContent = '';
    bar.style.display = 'none';
    barFill.style.width = '0%';
  }

  function reset() {
    chosen = null;
    cameraInput.value = ''; fileInput.value = '';
    review.classList.remove('show');
    cards.classList.remove('hide');
    setStatus('', '');
  }

  sendBtn.addEventListener('click', () => {
    if (!chosen) return;
    sendBtn.disabled = true; resetBtn.disabled = true;
    bar.style.display = 'block';
    setStatus('Uploading…', '');

    const form = new FormData();
    form.append('photo', chosen, chosen.name || 'photo.jpg');

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.upload.addEventListener('progress', (e) => {
      if (e.lengthComputable) barFill.style.width = Math.round((e.loaded / e.total) * 100) + '%';
    });
    xhr.addEventListener('load', () => {
      resetBtn.disabled = false;
      let res = {};
      try { res = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status >= 200 && xhr.status < 300 && res.ok) {
        setStatus('Sent. The plotter has your photo.', 'ok');
        meta.textContent = `${res.filename} · ${formatBytes(res.size_bytes)}`;
        resetBtn.textContent = 'Send another photo';
      } else {
        barFill.style.width = '0%'; sendBtn.disabled = false;
        setStatus(res.error || `Upload failed (HTTP ${xhr.status}).`, 'err');
      }
    });
    xhr.addEventListener('error', () => {
      resetBtn.disabled = false; sendBtn.disabled = false; barFill.style.width = '0%';
      setStatus('Could not reach the plotter. Check you’re on the same Wi-Fi.', 'err');
    });
    xhr.send(form);
  });

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }
  function formatBytes(b) {
    if (b == null) return '';
    const u = ['B','KB','MB']; let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }
</script>
</body>
</html>
